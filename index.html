<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPI-Pay - Premium Digital Marketplace & Streaming Platform</title>
    <meta name="description" content="Discover, preview, and unlock premium video courses, AI tools, developer resources, and digital assets with instant credit wallet and protected-content streaming." />
    
    <!-- Open Graph -->
    <meta property="og:title" content="UPI-Pay - Premium Digital Marketplace & Streaming Platform" />
    <meta property="og:description" content="Discover, preview, and unlock premium video courses, AI tools, developer resources, and digital assets with instant credit wallet and protected-content streaming." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#7C5CFF">
  </head>
  <body class="bg-[#07090F] text-[#F5F7FB] min-h-screen selection:bg-[#7C5CFF] selection:text-white">
    <div id="app" class="flex min-h-screen w-full">
      <!-- Desktop Sidebar -->
      <aside id="app-sidebar" class="hidden md:flex flex-col w-64 bg-[#10131C] border-r border-[#252B3B] shrink-0 sticky top-0 h-screen z-30">
        <!-- Logo -->
        <div class="p-5 border-b border-[#252B3B] flex items-center justify-between">
          <a href="#/dashboard" class="flex items-center gap-3 group">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#7C5CFF] to-[#9B83FF] flex items-center justify-center shadow-lg shadow-[#7C5CFF]/30 group-hover:scale-105 transition-transform">
              <span class="text-white font-extrabold text-lg tracking-wider">UP</span>
            </div>
            <div>
              <div class="font-extrabold text-lg text-white tracking-wide flex items-center gap-1.5">
                UPI-Pay
                <span class="text-[10px] bg-[#7C5CFF]/20 text-[#9B83FF] border border-[#7C5CFF]/40 px-1.5 py-0.5 rounded font-bold">PRO</span>
              </div>
              <div class="text-[11px] text-[#8992A7]">Digital Marketplace</div>
            </div>
          </a>
        </div>

        <!-- Navigation Links -->
        <div class="flex-1 overflow-y-auto px-4 py-5 space-y-6">
          <div>
            <div class="text-[11px] font-bold text-[#8992A7] tracking-wider uppercase px-3 mb-2">Main</div>
            <nav class="space-y-1">
              <a href="#/dashboard" data-nav="dashboard" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold text-[#8992A7] hover:text-white hover:bg-[#151925] transition-all">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Dashboard
              </a>
              <a href="#/marketplace" data-nav="marketplace" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold text-[#8992A7] hover:text-white hover:bg-[#151925] transition-all">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                Marketplace
              </a>
              <a href="#/library" data-nav="library" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold text-[#8992A7] hover:text-white hover:bg-[#151925] transition-all">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                My Library
              </a>
              <a href="#/wallet" data-nav="wallet" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold text-[#8992A7] hover:text-white hover:bg-[#151925] transition-all">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
                Wallet & Credits
              </a>
              <a href="#/transactions" data-nav="transactions" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold text-[#8992A7] hover:text-white hover:bg-[#151925] transition-all">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                Transactions
              </a>
            </nav>
          </div>

          <div>
            <div class="text-[11px] font-bold text-[#8992A7] tracking-wider uppercase px-3 mb-2">Account</div>
            <nav class="space-y-1">
              <a href="#/settings" data-nav="settings" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold text-[#8992A7] hover:text-white hover:bg-[#151925] transition-all">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Settings
              </a>
              <a href="#/support" data-nav="support" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold text-[#8992A7] hover:text-white hover:bg-[#151925] transition-all">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                Support & Help
              </a>
            </nav>
          </div>

          <!-- Admin Section (Only shown if Admin) -->
          <div id="sidebar-admin-section" class="hidden">
            <div class="text-[11px] font-bold text-[#FF5C75] tracking-wider uppercase px-3 mb-2 flex items-center justify-between">
              <span>Management</span>
              <span class="text-[9px] bg-[#FF5C75]/20 text-[#FF5C75] px-1.5 py-0.2 rounded font-bold">ADMIN</span>
            </div>
            <nav class="space-y-1">
              <a href="#/admin" data-nav="admin" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold text-[#8992A7] hover:text-white hover:bg-[#151925] transition-all">
                <svg class="w-5 h-5 shrink-0 text-[#FF5C75]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                Admin Control Panel
              </a>
            </nav>
          </div>
        </div>

        <!-- Sidebar Wallet Mini Summary -->
        <div class="p-4 border-t border-[#252B3B] bg-[#0B0E17]/60">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-[#8992A7]">Wallet Balance</span>
            <span id="sidebar-wallet-balance" class="text-sm font-extrabold text-[#35D49A]">-- Credits</span>
          </div>
          <button id="btn-sidebar-topup" class="w-full py-2 px-3 rounded-lg bg-[#7C5CFF]/15 hover:bg-[#7C5CFF]/25 border border-[#7C5CFF]/30 text-xs font-bold text-[#9B83FF] flex items-center justify-center gap-1.5 transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Top Up Credits
          </button>
        </div>
      </aside>

      <!-- Main Content Area -->
      <div class="flex-1 flex flex-col min-w-0 pb-20 md:pb-6">
        <!-- Top Header -->
        <header class="h-16 border-b border-[#252B3B] bg-[#10131C]/95 backdrop-blur-md sticky top-0 z-20 px-4 md:px-8 flex items-center justify-between gap-4">
          <!-- Mobile Menu & Title -->
          <div class="flex items-center gap-3">
            <a href="#/dashboard" class="md:hidden flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-[#7C5CFF] to-[#9B83FF] flex items-center justify-center font-extrabold text-sm text-white">UP</div>
              <span class="font-extrabold text-white text-base">UPI-Pay</span>
            </a>

            <!-- Search Bar -->
            <div class="relative hidden sm:block w-72 lg:w-96">
              <input id="header-search-input" type="text" placeholder="Search courses, videos, AI tools..." class="w-full bg-[#0D101A] border border-[#252B3B] rounded-xl pl-10 pr-4 py-2 text-xs md:text-sm text-white placeholder-[#8992A7] focus:outline-none focus:border-[#7C5CFF] transition-colors" />
              <svg class="w-4 h-4 text-[#8992A7] absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
          </div>

          <!-- Header Right Actions -->
          <div class="flex items-center gap-3 md:gap-4">
            <!-- DEMO SWITCHER PILL (Essential for reviewer testing!) -->
            <div class="flex items-center bg-[#07090F] border border-[#252B3B] rounded-xl p-1 text-xs">
              <button id="btn-switch-alex" class="px-2.5 py-1 rounded-lg font-bold text-xs transition-all text-[#8992A7] hover:text-white" title="Switch to Customer account (Alex)">
                User (Alex)
              </button>
              <button id="btn-switch-admin" class="px-2.5 py-1 rounded-lg font-bold text-xs transition-all text-[#8992A7] hover:text-white" title="Switch to Administrator account">
                Admin
              </button>
            </div>

            <!-- Header Wallet Quick Display -->
            <div id="header-wallet-pill" class="cursor-pointer hidden sm:flex items-center gap-2 bg-[#151925] border border-[#252B3B] hover:border-[#7C5CFF]/40 rounded-xl px-3 py-1.5 transition-all">
              <div class="w-2 h-2 rounded-full bg-[#35D49A] animate-pulse"></div>
              <span id="header-credits-count" class="font-extrabold text-sm text-[#F5F7FB]">--</span>
              <span class="text-xs text-[#8992A7]">Credits</span>
              <button id="btn-header-topup" class="ml-1 w-5 h-5 rounded-md bg-[#7C5CFF] text-white flex items-center justify-center text-xs font-bold hover:bg-[#6842FF]">+</button>
            </div>

            <!-- Notifications Bell -->
            <div class="relative">
              <button id="btn-toggle-notifications" class="relative p-2 rounded-xl bg-[#151925] border border-[#252B3B] text-[#8992A7] hover:text-white transition-colors" title="Notifications">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                <span id="notification-badge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-[#FF5C75] text-white text-[10px] font-bold rounded-full flex items-center justify-center animate-bounce">0</span>
              </button>

              <!-- Notifications Dropdown -->
              <div id="notifications-dropdown" class="hidden absolute right-0 mt-2 w-80 sm:w-96 bg-[#10131C] border border-[#252B3B] rounded-2xl shadow-2xl p-4 z-50">
                <div class="flex items-center justify-between pb-3 border-b border-[#252B3B]">
                  <span class="font-bold text-sm text-white">Notifications</span>
                  <button id="btn-mark-all-read" class="text-xs text-[#7C5CFF] hover:underline">Mark all read</button>
                </div>
                <div id="notifications-list" class="divide-y divide-[#252B3B] max-h-72 overflow-y-auto">
                  <div class="py-6 text-center text-xs text-[#8992A7]">No new notifications</div>
                </div>
              </div>
            </div>

            <!-- User Profile Avatar / Auth Buttons -->
            <div id="header-auth-container">
              <!-- Dynamically populated (logged in vs logged out) -->
            </div>
          </div>
        </header>

        <!-- Main View Outlet Container -->
        <main id="app-content" class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full animate-fade-in">
          <!-- Dynamically Rendered by View Controllers -->
        </main>
      </div>

      <!-- Mobile Bottom Navigation Bar -->
      <nav class="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-[#10131C]/95 backdrop-blur-md border-t border-[#252B3B] flex items-center justify-around z-40 px-2">
        <a href="#/dashboard" data-nav="dashboard" class="mobile-nav-link flex flex-col items-center text-[10px] font-semibold text-[#8992A7] py-1">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Home
        </a>
        <a href="#/marketplace" data-nav="marketplace" class="mobile-nav-link flex flex-col items-center text-[10px] font-semibold text-[#8992A7] py-1">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          Explore
        </a>
        <a href="#/library" data-nav="library" class="mobile-nav-link flex flex-col items-center text-[10px] font-semibold text-[#8992A7] py-1">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Library
        </a>
        <a href="#/wallet" data-nav="wallet" class="mobile-nav-link flex flex-col items-center text-[10px] font-semibold text-[#8992A7] py-1">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          Wallet
        </a>
        <a href="#/settings" data-nav="settings" class="mobile-nav-link flex flex-col items-center text-[10px] font-semibold text-[#8992A7] py-1">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          Profile
        </a>
      </nav>
    </div>

    <!-- Modals Container -->
    <div id="modal-container" class="relative z-50"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-4 md:right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
